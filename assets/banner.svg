<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ayman Nawar, Senior Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="0.6" stop-color="#12284a"/>
      <stop offset="1" stop-color="#1f4e8c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <g transform="translate(895 160)" fill="none" stroke="#8ab6f0">
      <ellipse rx="120" ry="46" stroke-width="3" stroke-opacity="0.75"/>
      <ellipse rx="120" ry="46" stroke-width="3" stroke-opacity="0.75" transform="rotate(60)"/>
      <ellipse rx="120" ry="46" stroke-width="3" stroke-opacity="0.75" transform="rotate(120)"/>
      <circle r="13" fill="#8ab6f0" stroke="none"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="130" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">Ayman Nawar</text>
      <text x="74" y="182" font-size="29" font-weight="600" fill="#dce8f8">Senior Full-Stack Engineer</text>
      <text x="74" y="232" font-size="23" font-weight="500" fill="#8ab6f0">React  ·  Next.js  ·  Node.js  ·  NestJS  ·  FastAPI</text>
    </g>
  </g>
</svg>
